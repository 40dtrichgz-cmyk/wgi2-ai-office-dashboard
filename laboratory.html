<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WGI AI Laboratory — 3D Glass Office</title>
  <style>
    body { margin: 0; overflow: hidden; background: #05070a; }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .badge {
      position: absolute;
      top: 24px; left: 24px;
      color: #22d3ee;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(10, 16, 26, 0.6);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.25);
      backdrop-filter: blur(6px);
      pointer-events: auto;
      user-select: none;
    }
    .hint {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      color: rgba(229, 231, 235, 0.55);
      font-size: 12px;
      text-align: center;
      max-width: 420px;
      line-height: 1.5;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="badge">WGI AI Laboratory · DEMO MODE · Liquid Glass 3D</div>
    <div class="hint">Orbit: drag · Zoom: scroll · Click a workstation to inspect · CEO workstation glows gold</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ================= CONFIG ================= */
    const CONFIG = {
      roomSize: 46,
      wallHeight: 14,
      floorY: 0,
      glassColor: 0x8ef7ff,
      glassOpacity: 0.12,
      accentCyan: 0x22d3ee,
      accentGold: 0xfbbf24,
      deepNavy: 0x050a14,
      crystalWhite: 0xe2e8f0,
      softSilver: 0x94a3b8
    };

    /* ================= SCENE ================= */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x05070a, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    // Isometric-ish high angle like the reference image
    camera.position.set(0, 22, 30);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 12;
    controls.maxDistance = 70;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    /* ================= LIGHTS ================= */
    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
    keyLight.position.set(12, 18, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 60;
    keyLight.shadow.camera.left = -22;
    keyLight.shadow.camera.right = 22;
    keyLight.shadow.camera.top = 22;
    keyLight.shadow.camera.bottom = -22;
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0x22d3ee, 2.2, 40);
    fillLight.position.set(-14, 6, 8);
    scene.add(fillLight);

    const rimLight = new THREE.SpotLight(0xffffff, 1.5, 60, 0.45, 0.5, 1);
    rimLight.position.set(0, 20, -14);
    rimLight.target.position.set(0, 2, 0);
    rimLight.castShadow = true;
    scene.add(rimLight);
    scene.add(rimLight.target);

    const ceoGlow = new THREE.PointLight(0xfbbf24, 4, 25);
    ceoGlow.position.set(0, 6, 0);
    scene.add(ceoGlow);

    /* ================= MATERIALS ================= */
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: CONFIG.glassColor,
      metalness: 0.35,
      roughness: 0.12,
      transmission: 0.92,
      transparent: true,
      opacity: CONFIG.glassOpacity,
      thickness: 0.6,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      side: THREE.DoubleSide
    });

    const frostedMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.25,
      roughness: 0.55,
      transmission: 0.55,
      transparent: true,
      opacity: 0.35,
      thickness: 0.9,
      clearcoat: 0.5,
      side: THREE.DoubleSide
    });

    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x0a0e18,
      roughness: 0.55,
      metalness: 0.45
    });

    const deskMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      roughness: 0.35,
      metalness: 0.65
    });

    const glassPanelMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.4,
      roughness: 0.1,
      transmission: 0.6,
      transparent: true,
      opacity: 0.55,
      thickness: 0.35,
      clearcoat: 1.0,
      side: THREE.DoubleSide
    });

    const neonMat = new THREE.MeshStandardMaterial({
      color: CONFIG.accentCyan,
      emissive: CONFIG.accentCyan,
      emissiveIntensity: 2.5,
      roughness: 0.1,
      metalness: 0.2
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: CONFIG.accentGold,
      emissive: CONFIG.accentGold,
      emissiveIntensity: 1.8,
      roughness: 0.25,
      metalness: 0.85
    });

    const personMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.55,
      metalness: 0.35
    });

    const ceoPersonMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.35,
      metalness: 0.55
    });

    /* ================= HELPERS ================= */
    function glassBox(w, h, d, mat = glassMat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = false, receive = false) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function glassPlane(w, h, mat = glassPanelMat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
      const geo = new THREE.PlaneGeometry(w, h);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function neonRect(w, h, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, color = CONFIG.accentCyan, intensity = 2.5) {
      const geo = new THREE.PlaneGeometry(w, h);
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, transparent: true, opacity: 0.9 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      scene.add(mesh);
      return mesh;
    }

    function person(x = 0, y = 0.85, z = 0, ceo = false, color = CONFIG.accentCyan, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);

      // Head
      const headGeo = new THREE.CapsuleGeometry(0.32, 0.25, 8, 16);
      const headMat = ceo ? ceoPersonMat : personMat;
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.05;
      head.castShadow = true;
      head.receiveShadow = true;
      group.add(head);

      // Body (blazer / suit)
      const bodyGeo = new THREE.CapsuleGeometry(0.42, 0.6, 8, 16);
      bodyGeo.rotateX(Math.PI / 2);
      const body = new THREE.Mesh(bodyGeo, headMat);
      body.position.y = 0.35;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Arms
      const armGeo = new THREE.CylinderGeometry(0.14, 0.11, 0.75, 8);
      const armL = new THREE.Mesh(armGeo, headMat);
      armL.position.set(-0.52, 0.3, 0);
      armL.rotation.z = -0.35;
      armL.castShadow = true;
      group.add(armL);

      const armR = new THREE.Mesh(armGeo, headMat);
      armR.position.set(0.52, 0.3, 0);
      armR.rotation.z = 0.35;
      armR.castShadow = true;
      group.add(armR);

      // Legs
      const legGeo = new THREE.CylinderGeometry(0.16, 0.13, 0.78, 8);
      const legL = new THREE.Mesh(legGeo, headMat);
      legL.position.set(-0.22, -0.35, 0);
      legL.castShadow = true;
      group.add(legL);

      const legR = new THREE.Mesh(legGeo, headMat);
      legR.position.set(0.22, -0.35, 0);
      legR.castShadow = true;
      group.add(legR);

      // Department accent chip on chest
      const chipGeo = new THREE.BoxGeometry(0.16, 0.16, 0.04);
      const chipMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2, transparent: true, opacity: 0.9 });
      const chip = new THREE.Mesh(chipGeo, chipMat);
      chip.position.set(0, 0.05, 0.44);
      group.add(chip);

      // CEO crown / halo marker
      if (ceo) {
        const haloGeo = new THREE.TorusGeometry(0.5, 0.05, 8, 24);
        const halo = new THREE.Mesh(haloGeo, goldMat);
        halo.position.y = 1.6;
        halo.rotation.x = Math.PI / 2;
        group.add(halo);

        const sashGeo = new THREE.BoxGeometry(0.1, 1.6, 0.06);
        const sash = new THREE.Mesh(sashGeo, goldMat);
        sash.position.set(0, 0.4, 0.46);
        group.add(sash);
      }

      return group;
    }

    function chair(x = 0, y = 0.6, z = 0, rotY = 0) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const seatGeo = new THREE.BoxGeometry(0.6, 0.12, 0.55);
      const seatMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 });
      const seat = new THREE.Mesh(seatGeo, seatMat);
      seat.position.y = 0.42;
      seat.castShadow = true;
      seat.receiveShadow = true;
      group.add(seat);

      const backGeo = new THREE.BoxGeometry(0.55, 0.45, 0.1);
      const back = new THREE.Mesh(backGeo, seatMat);
      back.position.set(0, 0.72, -0.3);
      back.castShadow = true;
      group.add(back);

      const legGeo = new THREE.BoxGeometry(0.07, 0.42, 0.07);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.9 });
      const positions = [[-0.24, 0.21, 0.21], [0.24, 0.21, 0.21], [-0.24, 0.21, -0.21], [0.24, 0.21, -0.21]];
      positions.forEach(([lx, ly, lz]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(lx, ly, lz);
        leg.castShadow = true;
        group.add(leg);
      });

      return group;
    }

    function desk(x = 0, y = 0, z = 0, w = 3, d = 2, rotY = 0, withMonitor = true) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const topGeo = new THREE.BoxGeometry(w, 0.35, d);
      const top = new THREE.Mesh(topGeo, deskMat);
      top.position.y = 0.9;
      top.castShadow = true;
      top.receiveShadow = true;
      group.add(top);

      const legGeo = new THREE.BoxGeometry(0.1, 0.9, 0.1);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.9 });
      const legPos = [[-w / 2 + 0.2, 0.45, -d / 2 + 0.2], [w / 2 - 0.2, 0.45, -d / 2 + 0.2], [-w / 2 + 0.2, 0.45, d / 2 - 0.2], [w / 2 - 0.2, 0.45, d / 2 - 0.2]];
      legPos.forEach(([lx, ly, lz]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(lx, ly, lz);
        leg.castShadow = true;
        group.add(leg);
      });

      if (withMonitor) {
        const monGeo = new THREE.BoxGeometry(1.1, 0.9, 0.12);
        const monMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.8 });
        const mon = new THREE.Mesh(monGeo, monMat);
        mon.position.set(0, 1.45, 0.1);
        mon.castShadow = true;
        group.add(mon);

        const screenGeo = new THREE.PlaneGeometry(0.98, 0.78);
        const screenMat = neonMat;
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.position.set(0, 1.45, 0.07);
        group.add(screen);

        const kbGeo = new THREE.BoxGeometry(0.9, 0.04, 0.45);
        const kb = new THREE.Mesh(kbGeo, new THREE.MeshStandardMaterial({ color: 0x020617 }));
        kb.position.set(0, 0.98, -0.6);
        group.add(kb);
      }

      return group;
    }

    function hologram(x = 0, y = 0, z = 0, w = 3, h = 3, text = 'AI', rotY = 0, color = CONFIG.accentCyan) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const frameGeo = new THREE.BoxGeometry(w, h, 0.06);
      const frame = new THREE.Mesh(frameGeo, glassPanelMat);
      frame.position.y = h / 2;
      frame.castShadow = false;
      group.add(frame);

      const glow = neonRect(w * 0.85, h * 0.85, 0, h / 2, 0.04, 0, rotY, color, 3);
      group.add(glow);

      return group;
    }

    /* ================= BUILD OFFICE ================= */
    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.roomSize, CONFIG.roomSize), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Floor grid accents
    const gridHelper = new THREE.GridHelper(CONFIG.roomSize, 24, 0x1e293b, 0x0f172a);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // Glass walls (back, left, right)
    const wallBack = glassBox(CONFIG.roomSize, CONFIG.wallHeight, 0.12, glassMat, 0, CONFIG.wallHeight / 2, -CONFIG.roomSize / 2);
    const wallLeft = glassBox(0.12, CONFIG.wallHeight, CONFIG.roomSize, glassMat, -CONFIG.roomSize / 2, CONFIG.wallHeight / 2, 0, 0, 0, 0);
    const wallRight = glassBox(0.12, CONFIG.wallHeight, CONFIG.roomSize, glassMat, CONFIG.roomSize / 2, CONFIG.wallHeight / 2, 0, 0, 0, 0);

    // Glass ceiling
    const ceiling = glassBox(CONFIG.roomSize, 0.12, CONFIG.roomSize, frostedMat, 0, CONFIG.wallHeight - 0.06, 0);

    // Glass partitions inside
    glassPlane(12, 7, glassPanelMat, -12, 4, -6, 0, Math.PI / 4);
    glassPlane(12, 7, glassPanelMat, 12, 4, -6, 0, -Math.PI / 4);
    glassPlane(10, 6, glassPanelMat, 0, 4, 8, 0, Math.PI / 2);

    /* ================= DEPARTMENTS ================= */
    // Layout based on reference image: isometric floor plan with 12 departments
    const depts = [
      { id: 'ai-ceo', name: 'CEO', pos: [0, 0.35, 2], rot: 0, color: CONFIG.accentGold, isCEO: true, deskW: 4.2, deskD: 3 },
      { id: 'ai-strategy', name: 'Strategy', pos: [-6, 0.35, -4], rot: Math.PI / 4, color: 0x34d399, isCEO: false, deskW: 2.8, deskD: 2 },
      { id: 'ai-sales', name: 'Sales', pos: [6, 0.35, -4], rot: -Math.PI / 4, color: 0x64748b, isCEO: false, deskW: 2.8, deskD: 2 },
      { id: 'ai-finance', name: 'Finance', pos: [0, 0.35, -8], rot: 0, color: 0x1e90ff, isCEO: false, deskW: 2.8, deskD: 2 },
      { id: 'ai-hr', name: 'HR', pos: [-7, 0.35, -10], rot: Math.PI / 6, color: 0xff6b6b, isCEO: false, deskW: 2.4, deskD: 1.8 },
      { id: 'ai-operations', name: 'Operations', pos: [7, 0.35, -10], rot: -Math.PI / 6, color: 0x888888, isCEO: false, deskW: 2.4, deskD: 1.8 },
      { id: 'ai-marketing', name: 'Marketing', pos: [-9, 0.35, 2], rot: Math.PI / 3, color: 0xf7931e, isCEO: false, deskW: 2.8, deskD: 2 },
      { id: 'ai-it-data', name: 'IT & Data', pos: [9, 0.35, 2], rot: -Math.PI / 3, color: 0x00ced1, isCEO: false, deskW: 2.8, deskD: 2 },
      { id: 'ai-legal', name: 'Legal', pos: [-4, 0.35, 6], rot: Math.PI / 2, color: 0x9b59b6, isCEO: false, deskW: 2.4, deskD: 1.8 },
      { id: 'ai-research', name: 'Research', pos: [4, 0.35, 6], rot: -Math.PI / 2, color: 0x2c3e50, isCEO: false, deskW: 2.4, deskD: 1.8 },
      { id: 'ai-support', name: 'Support', pos: [-1, 0.35, 10], rot: Math.PI, color: 0x34495e, isCEO: false, deskW: 2.8, deskD: 2 },
      { id: 'ai-admin', name: 'Admin', pos: [0, 0.35, -13], rot: 0, color: 0x7f8c8d, isCEO: false, deskW: 3, deskD: 2.2 }
    ];

    const people = [];

    depts.forEach(d => {
      // Glass department enclosure
      const encW = d.isCEO ? 5 : 3.2;
      const encD = d.isCEO ? 4 : 2.6;
      const enc = glassBox(encW, 6, encD, glassMat, d.pos[0], 3, d.pos[1], 0, d.rot, 0);

      // Nameplate glass sign
      const signW = d.isCEO ? 2.6 : 1.6;
      const sign = glassPlane(signW, 0.9, glassPanelMat, d.pos[0], 5.6, d.pos[1], 0, d.rot, 0);
      const signNeon = neonRect(signW * 0.75, 0.6, d.pos[0], 5.6, d.pos[1] + 0.03, 0, d.rot, 0, d.color, 2);

      // Desk
      desk(d.pos[0], 0, d.pos[1], d.deskW, d.deskD, d.rot, true);

      // Chair
      chair(d.pos[0], 0.55, d.pos[1], d.rot);

      // Person (CEO is larger, gold halo, central)
      const p = person(d.pos[0], 0.9, d.pos[1], d.isCEO, d.color, d.isCEO ? 1.35 : 1);
      people.push({ mesh: p, id: d.id, name: d.name, isCEO: d.isCEO, baseY: 0.9, color: d.color });

      // Department hologram above desk
      hologram(d.pos[0], 2.6, d.pos[1], d.isCEO ? 3.4 : 2.2, d.isCEO ? 3.4 : 2.2, d.isCEO ? 'CEO' : d.name.toUpperCase(), d.rot, d.color);

      // Side seating for collaboration areas
      if (!d.isCEO) {
        chair(d.pos[0] + (d.isCEO ? 0 : 1.1), 0.55, d.pos[1] + 1.1, d.rot + Math.PI);
      }
    });

    // Central CEO feature table & halo platform
    const ceoPlatform = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.4, 32), goldMat);
    ceoPlatform.position.set(0, 0.2, 2);
    ceoPlatform.castShadow = true;
    scene.add(ceoPlatform);

    const ceoHologram = new THREE.Mesh(new THREE.TorusKnotGeometry(1.1, 0.35, 100, 16), goldMat);
    ceoHologram.position.set(0, 1.6, 2);
    ceoHologram.castShadow = false;
    scene.add(ceoHologram);

    // Decorative plants
    function plant(x, z, s = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0.55, z);
      group.scale.setScalar(s);
      scene.add(group);
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      pot.position.y = 0.2;
      pot.castShadow = true;
      group.add(pot);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.4, 8), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
      leaves.position.y = 0.95;
      leaves.castShadow = true;
      group.add(leaves);
    }
    plant(-14, -12, 1.1);
    plant(14, -12, 1.1);
    plant(-16, 8, 0.9);
    plant(16, 8, 0.9);

    /* ================= HOLOGRAPHIC OVERLAYS ================= */
    // Floating glass panels around the room
    const panels = [
      { x: -20, y: 5, z: -4, w: 7, h: 5, ry: 0.3 },
      { x: 20, y: 5, z: -4, w: 7, h: 5, ry: -0.3 },
      { x: -14, y: 7, z: 14, w: 6, h: 4, ry: -0.8 },
      { x: 14, y: 7, z: 14, w: 6, h: 4, ry: 0.8 },
      { x: 0, y: 9, z: -22, w: 10, h: 6, ry: 0 }
    ];
    panels.forEach(p => {
      glassPlane(p.w, p.h, glassPanelMat, p.x, p.y, p.z, 0, p.ry, 0);
      neonRect(p.w * 0.8, p.h * 0.8, p.x, p.y, p.z + 0.03, 0, p.ry, CONFIG.accentCyan, 1.5);
    });

    /* ================= ANIMATION ================= */
    const clock = new THREE.Clock();
    let mixerUpdate = () => {};

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = clock.getDelta();

      controls.update();

      // Gentle bobbing for people + subtle rotation
      people.forEach(p => {
        const bob = Math.sin(t * 2 + p.mesh.position.x) * 0.04;
        p.mesh.position.y = p.baseY + bob;
        p.mesh.rotation.y = Math.sin(t * 0.5 + p.mesh.position.x) * 0.06;
        if (p.isCEO) {
          p.mesh.rotation.y = t * 0.15; // CEO rotates slowly
          ceoGlow.intensity = 3 + Math.sin(t * 3) * 1;
          ceoHologram.rotation.y = t * 0.4;
          ceoHologram.rotation.x = t * 0.2;
        }
      });

      // Hologram pulses
      scene.traverse(obj => {
        if (obj.material && obj.material.emissiveIntensity !== undefined && obj.material.emissiveIntensity > 0) {
          obj.material.emissiveIntensity = 2 + Math.sin(t * 4) * 0.6;
        }
      });

      renderer.render(scene, camera);
    }
    animate();

    /* ================= RESIZE ================= */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
