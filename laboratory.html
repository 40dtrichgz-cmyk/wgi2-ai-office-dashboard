<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WGI AI Laboratory — 3D Glass Office</title>
  <style>
    body { margin: 0; overflow: hidden; background: #05070a; }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .badge {
      position: absolute;
      top: 24px; left: 24px;
      color: #22d3ee;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      background: rgba(10, 16, 26, 0.6);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.25);
      backdrop-filter: blur(6px);
      pointer-events: auto;
      user-select: none;
    }
    .hint {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      color: rgba(229, 231, 235, 0.55);
      font-size: 12px;
      text-align: center;
      max-width: 420px;
      line-height: 1.5;
    }
    canvas { display: block; }

    /* Tooltip overlay */
    #tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      min-width: 210px;
      max-width: 270px;
      background: rgba(8, 12, 22, 0.94);
      border: 1px solid rgba(34, 211, 238, 0.4);
      border-radius: 12px;
      padding: 14px 16px;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.55;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55);
      transform: translate(0, 8px);
      /* Accessibility: ensure tooltip is readable and not clipped */
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    #tooltip.show { opacity: 1; transform: translate(0, 0); }
    #tooltip .t-title { font-size: 14.5px; font-weight: 800; color: #fff; margin-bottom: 2px; letter-spacing: 0.02em; }
    #tooltip .t-sub { font-size: 11px; color: #22d3ee; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.08em; }
    #tooltip .t-desc { color: #94a3b8; margin-bottom: 10px; line-height: 1.5; }
    #tooltip .t-skills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    #tooltip .t-skill {
      font-size: 9.5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.14);
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.35);
    }
    #tooltip .t-skill.gold {
      background: rgba(251, 191, 36, 0.18);
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.45);
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="badge">WGI AI Laboratory · DEMO MODE · Liquid Glass 3D</div>
    <div id="error-msg" style="position:absolute; top:80px; left:24px; color:#ff6b6b; display:none; font-size:13px; max-width:80%; word-wrap:break-word;"></div>
    <div id="sync-status" style="position:absolute; top:80px; right:24px; font-size:12px; color:#64748b; display:none;"></div>
    <div id="tooltip"></div>
    <div class="hint">Orbit: drag · Zoom: scroll · Hover a person to see role, duties &amp; skills</div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
      }
    }
  </script>
  <script type="module">
    window.addEventListener('error', function(e) {
      var el = document.getElementById('error-msg');
      el.style.display = 'block';
      el.textContent = 'JS Error: ' + (e.message || e.error);
    });
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    // Verify THREE loaded correctly
    if (!THREE || typeof THREE.Scene !== 'function') {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = 'Failed to load THREE library. Check your internet connection.';
    }

    /* ================= CONFIG ================= */
    const CONFIG = {
      roomSize: 60,
      wallHeight: 16,
      floorY: 0,
      glassColor: 0x8ef7ff,
      glassOpacity: 0.10,
      accentCyan: 0x22d3ee,
      accentGold: 0xfbbf24,
      deepNavy: 0x050a14,
      crystalWhite: 0xe2e8f0,
      softSilver: 0x94a3b8
    };

    /* ================= SCENE ================= */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x05070a, 0.032);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 220);
    // Isometric high angle like reference image
    camera.position.set(0, 28, 36);
    camera.lookAt(0, 2.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 14;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI / 2 - 0.04;

    /* ================= LIGHTS ================= */
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
    keyLight.position.set(14, 20, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 80;
    keyLight.shadow.camera.left = -30;
    keyLight.shadow.camera.right = 30;
    keyLight.shadow.camera.top = 30;
    keyLight.shadow.camera.bottom = -30;
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0x22d3ee, 2.0, 50);
    fillLight.position.set(-16, 7, 10);
    scene.add(fillLight);

    const rimLight = new THREE.SpotLight(0xffffff, 1.6, 70, 0.45, 0.5, 1);
    rimLight.position.set(0, 22, -16);
    rimLight.target.position.set(0, 2.5, 0);
    rimLight.castShadow = true;
    scene.add(rimLight);
    scene.add(rimLight.target);

    const ceoGlow = new THREE.PointLight(0xfbbf24, 5, 35);
    ceoGlow.position.set(0, 7, -16.45);
    scene.add(ceoGlow);

    /* ================= MATERIALS ================= */
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: CONFIG.glassColor,
      metalness: 0.3,
      roughness: 0.1,
      transmission: 0.93,
      transparent: true,
      opacity: CONFIG.glassOpacity,
      thickness: 0.7,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      side: THREE.DoubleSide
    });

    const frostedMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.2,
      roughness: 0.5,
      transmission: 0.6,
      transparent: true,
      opacity: 0.35,
      thickness: 0.9,
      clearcoat: 0.5,
      side: THREE.DoubleSide
    });

    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x2d2d2d,
      roughness: 0.9,
      metalness: 0.1
    });

    const deskMat = new THREE.MeshStandardMaterial({
      color: 0x6f4e37,
      roughness: 0.8,
      metalness: 0.1
    });

    const glassPanelMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.35,
      roughness: 0.08,
      transmission: 0.65,
      transparent: true,
      opacity: 0.55,
      thickness: 0.35,
      clearcoat: 1.0,
      side: THREE.DoubleSide
    });

    const neonMat = new THREE.MeshStandardMaterial({
      color: CONFIG.accentCyan,
      emissive: CONFIG.accentCyan,
      emissiveIntensity: 2.2,
      roughness: 0.1,
      metalness: 0.2
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: CONFIG.accentGold,
      emissive: CONFIG.accentGold,
      emissiveIntensity: 2.0,
      roughness: 0.2,
      metalness: 0.9
    });

    const suitMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.45,
      metalness: 0.5
    });

    const ceoSuitMat = new THREE.MeshStandardMaterial({
      color: 0x0b0d14,
      roughness: 0.35,
      metalness: 0.7
    });

    const shirtMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.6 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe9a486, roughness: 0.7 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });

    /* ================= HELPERS ================= */
    function glassBox(w, h, d, mat = glassMat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = false, receive = false) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function glassPlane(w, h, mat = glassPanelMat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
      const geo = new THREE.PlaneGeometry(w, h);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function neonRect(w, h, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, color = CONFIG.accentCyan, intensity = 2.2) {
      const geo = new THREE.PlaneGeometry(w, h);
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, transparent: true, opacity: 0.9 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      scene.add(mesh);
      return mesh;
    }

    // More detailed human character: head + hair + suit + shirt + arms + legs
    function person(x = 0, y = 0.85, z = 0, ceo = false, color = CONFIG.accentCyan, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);

      // --- Head ---
      const headGroup = new THREE.Group();
      headGroup.position.y = 1.02;
      group.add(headGroup);

      const headGeo = new THREE.SphereGeometry(0.3, 16, 16);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.castShadow = true;
      head.receiveShadow = true;
      headGroup.add(head);

      // Hair
      const hairGeo = new THREE.SphereGeometry(0.32, 16, 16);
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.scale.set(1, 0.85, 1);
      hair.position.y = 0.08;
      hair.position.z = 0.06;
      headGroup.add(hair);

      // --- Suit / Body ---
      const bodyGroup = new THREE.Group();
      bodyGroup.position.y = 0.25;
      group.add(bodyGroup);

      const torsoGeo = new THREE.BoxGeometry(0.44, 0.72, 0.3);
      const torso = new THREE.Mesh(torsoGeo, ceo ? ceoSuitMat : suitMat);
      torso.position.y = 0.05;
      torso.castShadow = true;
      torso.receiveShadow = true;
      bodyGroup.add(torso);

      // Shirt collar
      const collarGeo = new THREE.BoxGeometry(0.32, 0.18, 0.16);
      const collar = new THREE.Mesh(collarGeo, shirtMat);
      collar.position.set(0, 0.42, 0.17);
      bodyGroup.add(collar);

      // Tie (CEO gold, others cyan)
      const tieGeo = new THREE.BoxGeometry(0.07, 0.22, 0.03);
      const tieMat = new THREE.MeshStandardMaterial({ color: ceo ? CONFIG.accentGold : CONFIG.accentCyan, emissive: ceo ? CONFIG.accentGold : CONFIG.accentCyan, emissiveIntensity: 1.2 });
      const tie = new THREE.Mesh(tieGeo, tieMat);
      tie.position.set(0, 0.3, 0.2);
      bodyGroup.add(tie);

      // --- Arms ---
      const armGeo = new THREE.CylinderGeometry(0.12, 0.09, 0.7, 8);
      const armL = new THREE.Mesh(armGeo, suitMat);
      armL.position.set(-0.5, 0.1, 0);
      armL.rotation.z = -0.3;
      armL.castShadow = true;
      group.add(armL);

      const armR = new THREE.Mesh(armGeo, suitMat);
      armR.position.set(0.5, 0.1, 0);
      armR.rotation.z = 0.3;
      armR.castShadow = true;
      group.add(armR);

      // Hands
      const handGeo = new THREE.SphereGeometry(0.09, 8, 8);
      const handL = new THREE.Mesh(handGeo, skinMat);
      handL.position.set(-0.62, -0.22, 0);
      group.add(handL);
      const handR = new THREE.Mesh(handGeo, skinMat);
      handR.position.set(0.62, -0.22, 0);
      group.add(handR);

      // --- Legs ---
      const legGeo = new THREE.CylinderGeometry(0.13, 0.11, 0.85, 8);
      const legL = new THREE.Mesh(legGeo, suitMat);
      legL.position.set(-0.16, -0.5, 0);
      legL.castShadow = true;
      group.add(legL);

      const legR = new THREE.Mesh(legGeo, suitMat);
      legR.position.set(0.16, -0.5, 0);
      legR.castShadow = true;
      group.add(legR);

      // Shoes
      const shoeGeo = new THREE.BoxGeometry(0.18, 0.08, 0.28);
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0x020617 });
      const shoeL = new THREE.Mesh(shoeGeo, shoeMat);
      shoeL.position.set(-0.16, -0.98, 0.12);
      group.add(shoeL);
      const shoeR = new THREE.Mesh(shoeGeo, shoeMat);
      shoeR.position.set(0.16, -0.98, 0.12);
      group.add(shoeR);

      // Department accent chip on left chest
      const chipGeo = new THREE.BoxGeometry(0.15, 0.15, 0.04);
      const chipMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2, transparent: true, opacity: 0.9 });
      const chip = new THREE.Mesh(chipGeo, chipMat);
      chip.position.set(-0.18, 0.28, 0.22);
      bodyGroup.add(chip);

      // CEO halo / crown
      if (ceo) {
        const haloGeo = new THREE.TorusGeometry(0.55, 0.05, 8, 28);
        const halo = new THREE.Mesh(haloGeo, goldMat);
        halo.position.y = 1.75;
        halo.rotation.x = Math.PI / 2;
        group.add(halo);

        const sashGeo = new THREE.BoxGeometry(0.1, 1.7, 0.06);
        const sash = new THREE.Mesh(sashGeo, goldMat);
        sash.position.set(0, 0.45, 0.24);
        bodyGroup.add(sash);
      }

      return group;
    }

    function chair(x = 0, y = 0.55, z = 0, rotY = 0) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const seatGeo = new THREE.BoxGeometry(0.62, 0.12, 0.55);
      const seatMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 });
      const seat = new THREE.Mesh(seatGeo, seatMat);
      seat.position.y = 0.42;
      seat.castShadow = true;
      seat.receiveShadow = true;
      group.add(seat);

      const backGeo = new THREE.BoxGeometry(0.55, 0.45, 0.1);
      const back = new THREE.Mesh(backGeo, seatMat);
      back.position.set(0, 0.72, -0.3);
      back.castShadow = true;
      group.add(back);

      const legGeo = new THREE.BoxGeometry(0.06, 0.42, 0.06);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.9 });
      const positions = [[-0.25, 0.21, 0.2], [0.25, 0.21, 0.2], [-0.25, 0.21, -0.2], [0.25, 0.21, -0.2]];
      positions.forEach(([lx, ly, lz]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(lx, ly, lz);
        leg.castShadow = true;
        group.add(leg);
      });

      return group;
    }

    function desk(x = 0, y = 0, z = 0, w = 3, d = 2, rotY = 0, withMonitor = true) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const topGeo = new THREE.BoxGeometry(w, 0.35, d);
      const top = new THREE.Mesh(topGeo, deskMat);
      top.position.y = 0.92;
      top.castShadow = true;
      top.receiveShadow = true;
      group.add(top);

      const legGeo = new THREE.BoxGeometry(0.1, 0.92, 0.1);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.9 });
      const legPos = [[-w / 2 + 0.2, 0.46, -d / 2 + 0.2], [w / 2 - 0.2, 0.46, -d / 2 + 0.2], [-w / 2 + 0.2, 0.46, d / 2 - 0.2], [w / 2 - 0.2, 0.46, d / 2 - 0.2]];
      legPos.forEach(([lx, ly, lz]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(lx, ly, lz);
        leg.castShadow = true;
        group.add(leg);
      });

      if (withMonitor) {
        const monGeo = new THREE.BoxGeometry(1.2, 1, 0.12);
        const monMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.8 });
        const mon = new THREE.Mesh(monGeo, monMat);
        mon.position.set(0, 1.5, 0.1);
        mon.castShadow = true;
        group.add(mon);

        const screenGeo = new THREE.PlaneGeometry(1.05, 0.82);
        const screen = new THREE.Mesh(screenGeo, neonMat);
        screen.position.set(0, 1.5, 0.07);
        group.add(screen);

        const kbGeo = new THREE.BoxGeometry(1, 0.04, 0.5);
        const kb = new THREE.Mesh(kbGeo, new THREE.MeshStandardMaterial({ color: 0x020617 }));
        kb.position.set(0, 1, -0.65);
        group.add(kb);

        // Mouse
        const mouseGeo = new THREE.BoxGeometry(0.12, 0.04, 0.2);
        const mouse = new THREE.Mesh(mouseGeo, new THREE.MeshStandardMaterial({ color: 0x020617 }));
        mouse.position.set(0.35, 1, -0.55);
        group.add(mouse);

        // White ceramic coffee mug
        const mugGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.16, 16);
        const mugMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.25, metalness: 0.05 });
        const mug = new THREE.Mesh(mugGeo, mugMat);
        mug.position.set(-0.5, 1.0, -0.6);
        mug.castShadow = true;
        group.add(mug);

        // Brown leather-bound notebook
        const bookGeo = new THREE.BoxGeometry(0.35, 0.04, 0.28);
        const bookMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.85, metalness: 0.0 });
        const book = new THREE.Mesh(bookGeo, bookMat);
        book.position.set(0.5, 1.0, -0.6);
        book.castShadow = true;
        group.add(book);
      }

      return group;
    }

    function departmentSign(x, y, z, text, color, rotY, isCEO = false) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const w = isCEO ? 3.2 : 2;
      const h = isCEO ? 1.1 : 0.7;
      const frameGeo = new THREE.PlaneGeometry(w, h);
      const frame = new THREE.Mesh(frameGeo, glassPanelMat);
      frame.position.y = h / 2;
      frame.castShadow = false;
      group.add(frame);

      const glow = neonRect(w * 0.78, h * 0.6, 0, h / 2, 0.03, 0, rotY, color, 2);
      group.add(glow);

      return group;
    }

    function hologram(x, y, z, w, h, text, rotY, color) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotY;
      scene.add(group);

      const frameGeo = new THREE.BoxGeometry(w, h, 0.06);
      const frame = new THREE.Mesh(frameGeo, glassPanelMat);
      frame.position.y = h / 2;
      frame.castShadow = false;
      group.add(frame);

      const glow = neonRect(w * 0.82, h * 0.82, 0, h / 2, 0.04, 0, rotY, color, 2.6);
      group.add(glow);

      return group;
    }

    function plant(x, z, s = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0.5, z);
      group.scale.setScalar(s);
      scene.add(group);
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      pot.position.y = 0.2;
      pot.castShadow = true;
      group.add(pot);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
      leaves.position.y = 1.0;
      leaves.castShadow = true;
      group.add(leaves);
    }

    /* ================= BUILD OFFICE ================= */
    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.roomSize, CONFIG.roomSize), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(CONFIG.roomSize, 30, 0x1e293b, 0x0f172a);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // No walls/ceiling — fully open-air isometric office (open to the sky & city)
    // (Building shell intentionally removed so the scene reads as an open platform)

    // Night city skyline backdrop (visible through the open sides)
    const skylineMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.9, transparent: true, opacity: 0.92 });
    const skyline = new THREE.Mesh(new THREE.PlaneGeometry(160, 40), skylineMat);
    skyline.position.set(0, 12, -70);
    skyline.rotation.x = -Math.PI / 2;
    scene.add(skyline);

    // Skyline building silhouettes (procedural blocks with lit windows)
    const skylineGroup = new THREE.Group();
    const buildingSpecs = [
      { x: -60, h: 14, w: 8 }, { x: -48, h: 22, w: 6 }, { x: -36, h: 10, w: 7 },
      { x: -22, h: 26, w: 8 }, { x: -10, h: 12, w: 5 }, { x: 2, h: 30, w: 9 },
      { x: 16, h: 18, w: 7 }, { x: 28, h: 24, w: 8 }, { x: 42, h: 14, w: 6 },
      { x: 54, h: 20, w: 7 }, { x: 66, h: 12, w: 5 }
    ];
    buildingSpecs.forEach(b => {
      const building = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, b.h, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x04101f, roughness: 0.85 })
      );
      building.position.set(b.x, b.h / 2, -68);
      building.castShadow = false;
      skylineGroup.add(building);

      // Lit windows (cyan glow dots)
      const winGeo = new THREE.PlaneGeometry(0.4, 0.5);
      const winMat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 2.5, transparent: true, opacity: 0.9 });
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 3; col++) {
          const win = new THREE.Mesh(winGeo, winMat);
          win.position.set(b.x - b.w / 2 + 0.8 + col * (b.w / 3), 1.5 + row * (b.h / 5), -67.4);
          skylineGroup.add(win);
        }
      }
    });
    skylineGroup.position.y = 2;
    scene.add(skylineGroup);

    // Glass partitions inside (kept for interior decoration)
    glassPlane(14, 8, glassPanelMat, -16, 5, -8, 0, 0.4);
    glassPlane(14, 8, glassPanelMat, 16, 5, -8, 0, -0.4);
    glassPlane(12, 7, glassPanelMat, 0, 5, 14, 0, Math.PI / 2);

    /* ================= DEPARTMENTS ================= */
    // Layout: CEO at BACK center, other departments arranged in rows with clear spacing
    const depts = [
      // Row back (CEO center)
      { id: 'ai-ceo', name: 'CEO', title: 'AI CEO', desc: 'Executive oversight, final decisions, governance', pos: [0, 0.35, -14], rot: 0, color: CONFIG.accentGold, isCEO: true, deskW: 5, deskD: 4, skills: ['Strategy','Governance','Budget Approval','Risk Management','Executive Summary'], row: 0 },
      // Row 1 (left to right)
      { id: 'ai-strategy', name: 'Strategy', title: 'AI Strategy Officer', desc: 'Business planning, growth roadmap, market positioning', pos: [-22, 0.35, -6], rot: Math.PI / 6, color: 0x34d399, isCEO: false, deskW: 3, deskD: 2.2, skills: ['Roadmap','OKR','Market Analysis','Scenario Planning'], row: 1 },
      { id: 'ai-finance', name: 'Finance', title: 'AI Finance Lead', desc: 'Budgeting, financial modeling, cost analysis', pos: [-11, 0.35, -6], rot: Math.PI / 8, color: 0x1e90ff, isCEO: false, deskW: 3, deskD: 2.2, skills: ['Budgeting','Forecasting','ROI','Cash Flow','Financial Modeling'], row: 1 },
      { id: 'ai-hr', name: 'HR', title: 'AI HR Lead', desc: 'Talent acquisition, onboarding, culture, performance', pos: [0, 0.35, -6], rot: 0, color: 0xff6b6b, isCEO: false, deskW: 2.6, deskD: 2, skills: ['Recruiting','Onboarding','Performance','Culture','Policy'], row: 1 },
      { id: 'ai-operations', name: 'Operations', title: 'AI Operations Lead', desc: 'SOPs, SLA monitoring, process efficiency', pos: [11, 0.35, -6], rot: -Math.PI / 8, color: 0x888888, isCEO: false, deskW: 3, deskD: 2.2, skills: ['SOP','SLA','KPI','Process','Automation'], row: 1 },
      { id: 'ai-sales', name: 'Sales', title: 'AI Sales Lead', desc: 'Pipeline management, lead conversion, quota tracking', pos: [22, 0.35, -6], rot: -Math.PI / 6, color: 0x64748b, isCEO: false, deskW: 3, deskD: 2.2, skills: ['CRM','Pipeline','Quota','Forecasting','Negotiation'], row: 1 },
      // Row 2
      { id: 'ai-marketing', name: 'Marketing', title: 'AI Marketing Lead', desc: 'Brand positioning, campaigns, content creation', pos: [-22, 0.35, 2], rot: Math.PI / 6, color: 0xf7931e, isCEO: false, deskW: 3, deskD: 2.2, skills: ['Brand','Campaigns','Content','SEO','Analytics'], row: 2 },
      { id: 'ai-it-data', name: 'IT & Data', title: 'AI IT & Data Lead', desc: 'Infrastructure, data pipelines, DevOps, security', pos: [-11, 0.35, 2], rot: Math.PI / 8, color: 0x00ced1, isCEO: false, deskW: 3, deskD: 2.2, skills: ['Infrastructure','Data Pipeline','DevOps','Security','CI/CD'], row: 2 },
      { id: 'ai-legal', name: 'Legal', title: 'AI Legal Lead', desc: 'Compliance, contracts, regulatory adherence', pos: [0, 0.35, 2], rot: 0, color: 0x9b59b6, isCEO: false, deskW: 2.6, deskD: 2, skills: ['Contracts','Compliance','Risk','IP','Regulatory'], row: 2 },
      { id: 'ai-research', name: 'Research', title: 'AI Research Lead', desc: 'Market research, competitive intelligence, analytics', pos: [11, 0.35, 2], rot: -Math.PI / 8, color: 0x2c3e50, isCEO: false, deskW: 3, deskD: 2.2, skills: ['Market Research','Competitive Intel','Analytics','Data Mining','Reports'], row: 2 },
      { id: 'ai-support', name: 'Support', title: 'AI Support Lead', desc: 'Customer success, ticket resolution, feedback triage', pos: [22, 0.35, 2], rot: -Math.PI / 6, color: 0x34495e, isCEO: false, deskW: 3, deskD: 2.2, skills: ['Tickets','CSAT','Onboarding','Knowledge Base','Feedback'], row: 2 },
      // Row front
      { id: 'ai-admin', name: 'Admin', title: 'AI Admin Lead', desc: 'Scheduling, resource coordination, workflow hub', pos: [0, 0.35, 10], rot: Math.PI, color: 0x7f8c8d, isCEO: false, deskW: 3.4, deskD: 2.6, skills: ['Scheduling','Coordination','Workflow','Resources','Documentation'], row: 3 }
    ];

    const people = [];

    // Sort: CEO last so rendered/placed last conceptually; CEO at back center
    depts.forEach(d => {
      // Glass department enclosure
      const encW = d.isCEO ? 6 : 3.6;
      const encD = d.isCEO ? 5 : 3;
      const encH = d.isCEO ? 7 : 6;
      glassBox(encW, encH, encD, glassMat, d.pos[0], encH / 2, d.pos[1], 0, d.rot, 0);

      // Department sign above desk
      departmentSign(d.pos[0], 4.6, d.pos[1], d.name, d.color, d.rot, d.isCEO);

      // Desk (named for positioning)
      const deskObj = desk(d.pos[0], 0, d.pos[1], d.deskW, d.deskD, d.rot, true);
      deskObj.name = 'desk_' + d.id;

      // Chair
      chair(d.pos[0], 0.55, d.pos[1], d.rot);

      // Second chair for larger desks (Admin)
      if (d.deskW >= 3.4 && !d.isCEO) {
        const sitDepth = d.deskD / 2 + 0.45;
        const dx = Math.sin(d.rot) * sitDepth;
        const dz = Math.cos(d.rot) * sitDepth;
        chair(d.pos[0] - dx, 0.55, d.pos[1] + dz, d.rot + Math.PI);
      }

      // Person behind desk (named for positioning)
      const p = person(d.pos[0], 0.95, d.pos[1], d.isCEO, d.color, d.isCEO ? 1.25 : 1);
      p.name = 'character_' + d.id;
      people.push({ mesh: p, id: d.id, name: d.name, title: d.title, desc: d.desc, isCEO: d.isCEO, baseY: 0.95, color: d.color, skills: d.skills, rotY: d.rot });

      // Department hologram above desk
      hologram(d.pos[0], 2.2, d.pos[1], d.isCEO ? 4 : 2.6, d.isCEO ? 4 : 2.6, d.isCEO ? 'CEO ROOM' : d.name.toUpperCase(), d.rot, d.color);

      // Guest chair opposite
      if (!d.isCEO) {
        chair(d.pos[0], 0.55, d.pos[1] + 1.6, d.rot + Math.PI);
      }
    });

    // ========== Position person seated at their OWN desk + computer in front ==========
    // Each character is assigned to exactly one desk — no clustering at a central table.
    // 1 employee per desk by default; larger desks (CEO, Admin) get a 2nd employee.
    depts.forEach(d => {
      const person = scene.getObjectByName('character_' + d.id);
      const deskObj = scene.getObjectByName('desk_' + d.id);

      if (deskObj) {
        deskObj.scale.set(1, 1, 1);
      }

      if (person && deskObj) {
        // Desk local axes: +Z is "front" (monitor side), -Z is where the user sits (keyboard side).
        // Place the person just behind their own desk, facing it.
        const sitDepth = d.deskD / 2 + 0.45;
        const dx = Math.sin(d.rot) * sitDepth;
        const dz = Math.cos(d.rot) * sitDepth;

        person.position.set(
          d.pos[0] + dx,
          0.95,
          d.pos[2] - dz   // -Z side = keyboard/user side
        );
        // Face the desk (toward +Z in desk local space)
        person.rotation.y = d.rot;
      }

      // Add a computer monitor on the desk (in front of the person)
      if (deskObj) {
        const computer = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 0.8, 0.1),
          new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.8 })
        );
        computer.position.set(0, 0.75, -0.3);
        deskObj.add(computer);

        const screen = new THREE.Mesh(
          new THREE.PlaneGeometry(1.0, 0.65),
          neonMat
        );
        screen.position.set(0, 0.75, -0.36);
        deskObj.add(screen);
      }

      // Second employee for larger desks (CEO, Admin) — seated at the opposite side
      if (d.deskW >= 3.4 && !d.isCEO) {
        const p2 = person(d.pos[0], 0.95, d.pos[1], false, d.color, 1);
        p2.name = 'character_' + d.id + '_2';
        const sitDepth2 = d.deskD / 2 + 0.45;
        const dx2 = Math.sin(d.rot) * sitDepth2;
        const dz2 = Math.cos(d.rot) * sitDepth2;
        p2.position.set(
          d.pos[0] - dx2,
          0.95,
          d.pos[1] + dz2   // opposite side of the desk
        );
        p2.rotation.y = d.rot + Math.PI;   // face the desk from the other side
        people.push({ mesh: p2, id: d.id + '_2', name: d.name, title: d.title, desc: d.desc, isCEO: false, baseY: 0.95, color: d.color, skills: d.skills, rotY: d.rot + Math.PI });
      }
    });

    // ========== Add decorative icons around desks ==========
    const iconNames = ['icon_pyramid', 'icon_diamond', 'icon_cube'];
    const iconColors = [CONFIG.accentCyan, 0x34d399, 0xfbbf24];

    depts.forEach((d, deptIdx) => {
      const deskObj = scene.getObjectByName('desk_' + d.id);
      if (!deskObj) return;

      iconNames.forEach((name, iconIdx) => {
        const icon = new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.2, 0.2),
          new THREE.MeshStandardMaterial({
            color: iconColors[iconIdx],
            emissive: iconColors[iconIdx],
            emissiveIntensity: 1.5,
            transparent: true,
            opacity: 0.85
          })
        );
        icon.name = name + '_' + d.id;
        const angle = (iconIdx / iconNames.length) * Math.PI * 2 + (deptIdx * 0.5);
        icon.position.set(
          Math.cos(angle) * 1.8,
          1.2,
          Math.sin(angle) * 1.8
        );
        icon.scale.set(0.8, 0.8, 0.8);
        deskObj.add(icon);
      });
    });

    // Central CEO feature platform (aligned with CEO desk at z=-14)
    const ceoPlatform = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.5, 32), goldMat);
    ceoPlatform.position.set(0, 0.25, -14);
    ceoPlatform.castShadow = true;
    scene.add(ceoPlatform);

    const ceoHologram = new THREE.Mesh(new THREE.TorusKnotGeometry(1.4, 0.45, 120, 20), goldMat);
    ceoHologram.position.set(0, 1.9, -14);
    ceoHologram.castShadow = false;
    scene.add(ceoHologram);

    // Plants at corners and rows
    plant(-30, -30, 1.1);
    plant(30, -30, 1.1);
    plant(-32, 14, 0.9);
    plant(32, 14, 0.9);
    plant(-32, -12, 0.9);
    plant(32, -12, 0.9);

    /* ================= HOLOGRAPHIC OVERLAYS ================= */
    const panels = [
      { x: -32, y: 6, z: -10, w: 9, h: 6, ry: 0.3 },
      { x: 32, y: 6, z: -10, w: 9, h: 6, ry: -0.3 },
      { x: -26, y: 7, z: 16, w: 8, h: 5, ry: -0.9 },
      { x: 26, y: 7, z: 16, w: 8, h: 5, ry: 0.9 },
      { x: 0, y: 10, z: -34, w: 12, h: 7, ry: 0 }
    ];
    panels.forEach(p => {
      glassPlane(p.w, p.h, glassPanelMat, p.x, p.y, p.z, 0, p.ry, 0);
      neonRect(p.w * 0.82, p.h * 0.82, p.x, p.y, p.z + 0.03, 0, p.ry, CONFIG.accentCyan, 1.4);
    });

    /* ================= n8n LIVE SYNC ================= */
    const syncStatus = document.getElementById('sync-status');
    let syncTimer = null;

    function fetchLiveStatus() {
      fetch('data/departments.json')
        .then(r => r.json())
        .then(data => {
          syncStatus.style.display = 'block';
          syncStatus.textContent = 'LIVE SYNC · ' + data.updated;
          syncStatus.style.color = '#22d3ee';
          people.forEach(p => {
            const dept = data.departments[p.id];
            if (dept) {
              p.progress = dept.progress;
              p.risk = dept.risk;
            }
          });
        })
        .catch(() => {
          syncStatus.style.display = 'block';
          syncStatus.textContent = 'LIVE SYNC · OFFLINE';
          syncStatus.style.color = '#ff6b6b';
        });
    }

    // Poll for live updates every 30 seconds
    syncTimer = setInterval(fetchLiveStatus, 30000);
    fetchLiveStatus();

    /* ================= INTERACTION (HOVER TOOLTIP) ================= */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');
    let hovered = null;

    function setTooltip(html) {
      if (!html) { tooltip.classList.remove('show'); tooltip.innerHTML = ''; return; }
      tooltip.innerHTML = html;
      tooltip.classList.add('show');
    }

    function positionTooltip(x, y) {
      const w = window.innerWidth, h = window.innerHeight;
      let tx = x + 18, ty = y + 18;
      const tw = 270, th = 200;
      if (tx + tw > w) tx = x - tw - 18;
      if (ty + th > h) ty = y - th - 18;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
    }

    function buildTooltipHTML(p) {
      const skills = p.skills.map(s => `<span class="t-skill${p.isCEO ? ' gold' : ''}">${s}</span>`).join('');
      const live = p.progress !== undefined ? `
        <div style="margin-top:8px; font-size:10px; color:#64748b;">
          PROGRESS: <span style="color:#22d3ee;">${p.progress}%</span> · RISK: <span style="color:${p.risk === 'high' || p.risk === 'critical' ? '#ff6b6b' : '#22d3ee'};">${p.risk}</span>
        </div>` : '';
      return `
        <div class="t-title">${p.title}</div>
        <div class="t-sub">${p.name} Department</div>
        <div class="t-desc">${p.desc}</div>
        <div style="font-size:10px;color:#64748b;margin-bottom:6px;">SKILLS</div>
        <div class="t-skills">${skills}</div>${live}
      `;
    }

    function onPointerMove(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(scene.children, true);
      let found = null;
      for (const hit of hits) {
        let n = hit.object;
        while (n && n !== scene) {
          const p = people.find(x => x.mesh === n);
          if (p) { found = p; break; }
          n = n.parent;
        }
        if (found) break;
      }

      // Update hover scale for all people (including 2nd employees)
      people.forEach(p => {
        if (p !== found && p !== hovered) {
          const resetScale = p.isCEO ? 1.25 : 1;
          gsap.to(p.mesh.scale, {
            x: resetScale, y: resetScale, z: resetScale,
            duration: 0.2, ease: "power2.out"
          });
        }
      });

      if (found !== hovered) {
        // Reset scale of previously hovered item
        if (hovered) {
          const resetScale = hovered.isCEO ? 1.25 : 1;
          gsap.to(hovered.mesh.scale, {
            x: resetScale,
            y: resetScale,
            z: resetScale,
            duration: 0.2,
            ease: "power2.out"
          });
        }

        hovered = found;

        if (found) {
          // Scale up hovered item
          const targetScale = (found.isCEO ? 1.25 : 1) * 1.1;
          gsap.to(found.mesh.scale, {
            x: targetScale,
            y: targetScale,
            z: targetScale,
            duration: 0.2,
            ease: "power2.out"
          });
          setTooltip(buildTooltipHTML(found));
        } else {
          setTooltip(null);
        }
      }
      if (found) positionTooltip(event.clientX, event.clientY);
    }

    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerleave', () => { hovered = null; setTooltip(null); });

    /* ================= ANIMATION (GSAP OPTIMIZED) ================= */
    // character bobbing and rotation
    people.forEach((p, i) => {
      // Bobbing animation
      gsap.to(p.mesh.position, {
        y: p.baseY + 0.05,
        duration: 1.5 + Math.random(),
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
        delay: i * 0.1
      });

      // Subtle rotation animation (relative to current facing direction)
      gsap.to(p.mesh.rotation, {
        y: "+=0.06",
        duration: 2 + Math.random(),
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
        delay: i * 0.15
      });
    });

    // CEO Specific animations
    const ceo = people.find(p => p.isCEO);
    if (ceo) {
      // CEO continuous rotation
      gsap.to(ceo.mesh.rotation, {
        y: "+=" + (Math.PI * 2),
        duration: 20,
        repeat: -1,
        ease: "none"
      });

      // CEO Glow pulse
      gsap.to(ceoGlow, {
        intensity: 6,
        duration: 1,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      });

      // CEO Hologram rotation
      gsap.to(ceoHologram.rotation, {
        y: Math.PI * 2,
        x: Math.PI,
        duration: 8,
        repeat: -1,
        ease: "none"
      });
    }

    // Global emissive pulse (holograms)
    const emissiveObjects = [];
    scene.traverse(obj => {
      if (obj.material && obj.material.emissiveIntensity !== undefined && obj.material.emissiveIntensity > 0) {
        emissiveObjects.push(obj.material);
      }
    });

    if (emissiveObjects.length > 0) {
      gsap.to(emissiveObjects, {
        emissiveIntensity: 2.5,
        duration: 1.2,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
        stagger: {
          each: 0.05,
          from: "random"
        }
      });
    }

    // Optimized Render Loop using GSAP Ticker
    function render() {
      controls.update();
      renderer.render(scene, camera);
    }
    gsap.ticker.add(render);

    /* ================= RESIZE ================= */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
